algo:
  algo: ppo
  hyperparams:
    learning_rate: 0.0001607
    n_steps: 2048
    batch_size: 64
    n_epochs: 16
    gamma: 0.99
    gae_lambda: 0.9498
    clip_range: 0.1628
    ent_coef: 0.0
    vf_coef: 0.5
    max_grad_norm: 0.5
  n_envs: 1
  search_space:
    learning_rate:
      type: float
      low: 1.0e-05
      high: 0.001
      log: true
    clip_range:
      type: float
      low: 0.1
      high: 0.4
    n_epochs:
      type: int
      low: 3
      high: 20
    n_steps:
      type: categorical
      choices:
      - 512
      - 1024
      - 2048
      - 4096
    gae_lambda:
      type: float
      low: 0.8
      high: 0.99
env:
  level: 3
  model_path: assets/balance_bot.xml
  frame_skip: 5
  max_episode_steps: 1000
  termination_pitch: 0.6
  initial_pitch_range: 0.05
  reward_weights:
    alive: 1.0
    theta: 1.0
    dtheta: 0.1
    vel: 0.5
    yaw: 0.2
    effort: 0.01
    smooth: 0.05
  perturbations:
    enabled: true
    f_max: 8.0
    direction: sagittal
    duration: 0.1
    mean_interval: 2.0
  commands:
    enabled: true
    min_interval: 2.0
    max_interval: 4.0
    v_max: 0.5
    yaw_rate_max: 1.0
  randomization:
    enabled: true
    mass_range: 0.2
    friction_range: 0.3
    torque_range: 0.1
    max_latency: 2
    noise:
      pitch: 0.01
      pitch_rate: 0.05
      yaw_rate: 0.05
      wheel_left: 0.1
      wheel_right: 0.1
  render:
    camera: track
    width: 640
    height: 480
common:
  policy: MlpPolicy
  net_arch:
  - 256
  - 256
  total_timesteps: 1000000
  device: cpu
  torch_threads: 1
  normalize: false
  eval:
    freq: 10000
    n_episodes: 10
    seed_offset: 100000
seed: 4
total_timesteps: 1000000
diagnostics:
  freq: 50000
  n_episodes: 3
  seed_offset: 200000
  q_overestimation:
    truncation_margin: 300
  smoothness:
    cutoff_hz: 5.0
