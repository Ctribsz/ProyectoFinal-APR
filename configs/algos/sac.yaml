algo: sac

# E10 (§6): mejor prueba del afinamiento, #0 del estudio sac_level2, objetivo 878.1
# (17 completas, 23 podadas; 40 × 200k en el nivel 2, mismo protocolo que DDPG y PPO).
# Afinado: learning_rate 2.2881e-04, ent_coef auto, tau 5.5392e-03, batch_size 128. El resto, valores de F2.
# Valores de F2 antes del afinamiento:
# F2: valores por defecto de SB3 2.x.
hyperparams:
  learning_rate: 2.2881e-04
  buffer_size: 1000000
  learning_starts: 100
  batch_size: 128
  tau: 5.5392e-03
  gamma: 0.99
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  target_entropy: auto

n_envs: 1

# F3 (§6): tasa de aprendizaje, coeficiente de entropía (fijo vs. automático), τ, tamaño de batch.
search_space:
  learning_rate: {type: float, low: 1.0e-5, high: 3.0e-3, log: true}
  ent_coef:      {type: categorical, choices: [auto, 0.001, 0.01, 0.05, 0.1]}
  tau:           {type: float, low: 0.001, high: 0.05, log: true}
  batch_size:    {type: categorical, choices: [64, 128, 256, 512]}
