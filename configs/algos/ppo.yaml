algo: ppo

# E10 (§6): mejor prueba del afinamiento, #34 del estudio ppo_level2, objetivo 865.9; ver
# docs/afinamiento/ppo_level2.md. Se afinaron learning_rate, clip_range, n_epochs, n_steps y gae_lambda; el
# resto sigue con los valores por defecto de SB3 2.x (F2). Valores de F2 de lo afinado: learning_rate 3.0e-4,
# n_steps 2048, n_epochs 10, gae_lambda 0.95, clip_range 0.2.
hyperparams:
  learning_rate: 1.607e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 16
  gamma: 0.99
  gae_lambda: 0.9498
  clip_range: 0.1628
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5

# F2: un solo entorno, como el valor por defecto de SB3 y la medición de tiempos de entregables.md.
# Con n_envs > 1 cada rollout junta n_steps × n_envs transiciones.
n_envs: 1

# F3 (§6): tasa de aprendizaje, rango de clip, número de épocas, n_steps, λ de GAE.
# Todas las opciones de n_steps son múltiplos de batch_size (64), como pide SB3.
search_space:
  learning_rate: {type: float, low: 1.0e-5, high: 1.0e-3, log: true}
  clip_range:    {type: float, low: 0.1, high: 0.4}
  n_epochs:      {type: int, low: 3, high: 20}
  n_steps:       {type: categorical, choices: [512, 1024, 2048, 4096]}
  gae_lambda:    {type: float, low: 0.8, high: 0.99}
