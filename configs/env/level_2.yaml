# Nivel 2: seguimiento de velocidad con empujones (especificación §4.6).
level: 2
model_path: assets/balance_bot.xml   # relativo a la raíz del repositorio
frame_skip: 5                        # 0.002 s × 5 = control a 100 Hz
max_episode_steps: 1000              # 10 s
termination_pitch: 0.6               # rad
initial_pitch_range: 0.05            # rad, θ0 ~ U(-r, r)

reward_weights:
  alive: 1.0
  theta: 1.0
  dtheta: 0.1
  vel: 0.5
  yaw: 0.2
  effort: 0.01
  smooth: 0.05

perturbations:
  enabled: true
  f_max: 8.0            # N [PROPUESTA]: con 15 N el robot sale a 2.4 m/s y vuelca al girar; ver docs/entregables.md (E8)
  direction: sagittal   # sagittal (adelante/atrás) | any
  duration: 0.1         # s
  mean_interval: 2.0    # s, intervalo medio entre empujones (Poisson)

commands:
  enabled: true
  min_interval: 2.0     # s
  max_interval: 4.0     # s
  # Rangos de comando: definen los límites de la observación y deben ser iguales en todos los niveles.
  v_max: 0.5          # m/s
  yaw_rate_max: 1.0   # rad/s

randomization:
  enabled: false

render:
  camera: track       # cámara del MJCF que sigue al robot
  width: 640
  height: 480
