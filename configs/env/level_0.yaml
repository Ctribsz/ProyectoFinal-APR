# Nivel 0: balanceo en reposo (especificación §4.6).
level: 0
model_path: assets/balance_bot.xml   # relativo a la raíz del repositorio
frame_skip: 5                        # 0.002 s × 5 = control a 100 Hz
max_episode_steps: 1000              # 10 s
termination_pitch: 0.6               # rad
initial_pitch_range: 0.05            # rad, θ0 ~ U(-r, r)

reward_weights:
  alive: 1.0
  theta: 1.0
  dtheta: 0.1
  vel: 0.0
  yaw: 0.0
  effort: 0.01
  smooth: 0.05

perturbations:
  enabled: false

commands:
  enabled: false
  # Rangos de comando: definen los límites de la observación y deben ser iguales en todos los niveles.
  v_max: 0.5          # m/s
  yaw_rate_max: 1.0   # rad/s

randomization:
  enabled: false

render:
  camera: track       # cámara del MJCF que sigue al robot
  width: 640
  height: 480
